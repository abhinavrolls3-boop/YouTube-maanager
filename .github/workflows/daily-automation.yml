name: FactVerse daily automation
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many topics to prepare (1-3)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
permissions:
  contents: read
concurrency:
  group: factverse-daily-automation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore best-effort upload history cache
        uses: actions/cache@v4
        with:
          path: output/upload_history.json
          key: factverse-upload-history-${{ github.run_id }}
          restore-keys: factverse-upload-history-
      - name: Install local narration engine
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run automated tests
        env:
          PYTHONPATH: src
        run: pytest -q
      - name: Prepare daily videos and quality report
        env:
          PYTHONPATH: src
          DAYS: "${{ inputs.days || '1' }}"
          ENABLE_AI_DRAFTS: "${{ vars.ENABLE_AI_DRAFTS || 'false' }}"
          ENABLE_NARRATION: "true"
          ENABLE_SOURCE_CHECKS: "true"
          OMNIROUTE_API_KEY: "${{ secrets.OMNIROUTE_API_KEY }}"
          OMNIROUTE_BASE_URL: "${{ vars.OMNIROUTE_BASE_URL }}"
          OMNIROUTE_MODEL: "${{ vars.OMNIROUTE_MODEL }}"
        run: python -m factverse_manager.cli batch --days "$DAYS"
      - name: Verify generated artifact integrity
        env:
          PYTHONPATH: src
        run: |
          python -m factverse_manager.cli verify-manifest output/artifact_manifest.json
          python - <<'PY'
          import json
          report = json.load(open("output/automation_report.json", encoding="utf-8"))
          print("Successful packages:", report.get("successful", 0))
          print("Failed packages:", report.get("failed", 0))
          if report.get("successful", 0) < 1:
              raise SystemExit("No packages passed preflight. Publishing is blocked.")
          PY
      - name: Publishing remains manual after review
        run: echo "Automatic publishing is intentionally disabled. Review each package and approve metadata manually before using the upload CLI."
      - name: Send optional completion notification
        if: always()
        env:
          NOTIFY_WEBHOOK_URL: "${{ secrets.NOTIFY_WEBHOOK_URL }}"
          REPORT_PATH: output/automation_report.json
        run: |
          if [ -f "$REPORT_PATH" ]; then
            PYTHONPATH=src python -c 'import json, os; from factverse_manager.notifications import notify_report; print(json.dumps(notify_report(json.load(open(os.environ["REPORT_PATH"], encoding="utf-8")))))'
          else
            echo "No report generated; inspect this workflow run's logs."
            if [ -n "$NOTIFY_WEBHOOK_URL" ]; then
              PYTHONPATH=src python -c 'import json; from factverse_manager.notifications import notify_report; print(json.dumps(notify_report({"successful": 0, "failed": 1, "note": "workflow failed before report creation"})))'
            fi
          fi
      - name: Write run summary for phone-friendly status checks
        if: always()
        env:
          REPORT_PATH: output/automation_report.json
        run: |
          {
            echo "# FactVerse daily run"
            echo
            echo "- **Run:** [Open this run](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo "- **Schedule:** 09:00 India time (best-effort GitHub runner)"
            echo "- **Publishing:** disabled; generated videos are drafts for review"
            if [ -f "$REPORT_PATH" ]; then
              python - <<'PY'
          import json, os
          report = json.load(open(os.environ["REPORT_PATH"], encoding="utf-8"))
          print(f"- **Ready for review:** {report.get('successful', 0)}")
          print(f"- **Failed:** {report.get('failed', 0)}")
          print(f"- **Needs attention:** {report.get('needs_attention', 0)}")
          print()
          print("| Topic | Status | Notes |")
          print("|---|---|---|")
          for item in report.get("items", []):
              notes = "; ".join(item.get("warnings", [])) or item.get("error", "")
              notes = notes.replace("|", "\\|").replace("\n", " ")
              print(f"| {item.get('topic', 'unknown')} | {item.get('status', 'unknown')} | {notes} |")
          PY
            else
              echo "- **Report:** not created; inspect the run logs for the first failed step."
            fi
            echo
            echo "## Get the generated files"
            echo "Open this run and look under **Artifacts** for `factverse-daily-${GITHUB_RUN_ID}`. The artifact is temporary and expires after 7 days."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload production artifacts and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factverse-daily-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
