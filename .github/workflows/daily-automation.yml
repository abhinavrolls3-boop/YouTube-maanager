name: FactVerse daily automation
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many topics to prepare (1-3)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
permissions:
  contents: read
concurrency:
  group: factverse-daily-automation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore best-effort upload history cache
        uses: actions/cache@v4
        with:
          path: output/upload_history.json
          key: factverse-upload-history-${{ github.run_id }}
          restore-keys: factverse-upload-history-
      - name: Install local narration engine
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run automated tests
        env:
          PYTHONPATH: src
        run: pytest -q
      - name: Prepare daily videos and quality report
        env:
          PYTHONPATH: src
          DAYS: "${{ inputs.days || '1' }}"
          ENABLE_AI_DRAFTS: "${{ vars.ENABLE_AI_DRAFTS || 'false' }}"
          ENABLE_NARRATION: "true"
          OMNIROUTE_API_KEY: "${{ secrets.OMNIROUTE_API_KEY }}"
          OMNIROUTE_BASE_URL: "${{ vars.OMNIROUTE_BASE_URL }}"
          OMNIROUTE_MODEL: "${{ vars.OMNIROUTE_MODEL }}"
        run: python -m factverse_manager.cli batch --days "$DAYS"
      - name: Upload packages as unlisted videos (explicit opt-in only)
        if: vars.ENABLE_YOUTUBE_UPLOAD == 'true' && vars.APPROVE_AUTOMATED_UNLISTED_UPLOAD == 'true'
        env:
          PYTHONPATH: src
          ENABLE_UPLOAD: "true"
          UPLOAD_PRIVACY: unlisted
          YOUTUBE_TOKEN_JSON: "${{ secrets.YOUTUBE_TOKEN_JSON }}"
        run: |
          python - <<'PY'
          import json, subprocess, sys
          report = json.load(open("output/automation_report.json", encoding="utf-8"))
          ready = [item for item in report.get("items", []) if item.get("status") == "ready_for_review"]
          if not ready:
              raise SystemExit("No valid package ready for upload.")
          for item in ready:
              paths = item["artifacts"]
              subprocess.run([sys.executable, "-m", "factverse_manager.cli", "upload", paths["video"], paths["metadata"]], check=True)
          PY
      - name: Send optional completion notification
        if: always()
        env:
          NOTIFY_WEBHOOK_URL: "${{ secrets.NOTIFY_WEBHOOK_URL }}"
          REPORT_PATH: output/automation_report.json
        run: |
          if [ -f "$REPORT_PATH" ]; then
            PYTHONPATH=src python -c 'import json, os; from factverse_manager.notifications import notify_report; print(json.dumps(notify_report(json.load(open(os.environ["REPORT_PATH"], encoding="utf-8")))))'
          else
            echo "No report generated; inspect this workflow run's logs."
          fi
      - name: Upload production artifacts and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factverse-daily-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
