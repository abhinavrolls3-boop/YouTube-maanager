name: Build FactVerse sample
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      topic:
        description: "Choose an offline fact topic"
        required: true
        type: choice
        default: sample
        options:
          - sample
          - astronauts-float
          - octopus-hearts
          - venus-day
          - sharks-older
          - honey
permissions:
  contents: read
concurrency:
  group: factverse-manual-build
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest -q
      - name: Render selected topic
        env:
          PYTHONPATH: src
          TOPIC: "${{ inputs.topic || 'sample' }}"
        run: |
          if [ "$TOPIC" = "sample" ]; then
            python -m factverse_manager.cli
          else
            python -m factverse_manager.cli render "$TOPIC"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: factverse-${{ inputs.topic || 'sample' }}
          path: output/
          if-no-files-found: error
          retention-days: 3
